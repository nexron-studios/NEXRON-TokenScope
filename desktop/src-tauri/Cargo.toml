[package]
name = "nexron-tokenscope-desktop"
version = "0.1.0"
description = "Desktop-Hülle für NEXRON-TokenScope"
authors = ["NEXRON"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"

# Nur fuer das Job-Objekt, das das Backend zusammen mit dem Fenster beendet.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
